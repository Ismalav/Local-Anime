name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      cap_server_url:
        description: "HTTPS URL loaded inside the app (e.g. https://openanimee.netlify.app)"
        required: false
        default: "https://openanimee.netlify.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Next app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        env:
          CAP_SERVER_URL: ${{ inputs.cap_server_url }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-anime-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
